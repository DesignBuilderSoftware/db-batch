[project]
name = "db-batch"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "db-process @ git+https://github.com/DesignBuilderSoftware/db-process.git@33c6ea2af3cacaf211e4934b1562f16950142f72",
    "pandas>=2.3.3,<3",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pylint>=3.3.9,<4",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 96

[tool.pylint."messages control"]
disable = [
    "C0301", # line-too-long, line length is owned by ruff-format
]

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7
